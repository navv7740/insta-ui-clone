<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">

    <div class="logo">Instagram</div>

    <div class="search-box">
        <input type="text" placeholder="Search...">
    </div>

</header>

<div class="profile-container">

    <div class="profile-header">

        <img src="https://images.pexels.com/photos/21267056/pexels-photo-21267056.jpeg" alt="Profile">

        <div class="profile-info">

            <h1>Franchesca</h1>

            <p>Calm & Composed</p>

            <div class="stats">

                <div>
                    <h3>6</h3>
                    <span>Posts</span>
                </div>

                <div>
                    <h3>1.5K</h3>
                    <span>Followers</span>
                </div>

                <div>
                    <h3>450</h3>
                    <span>Following</span>
                </div>

            </div>

            <p class="bio">
               documenting if dementia ever hits
            </p>

        </div>

    </div>

    <h2>My Posts</h2>

    <div class="post-grid">

        <img src="https://images.pexels.com/photos/24971928/pexels-photo-24971928.jpeg">
        <img src="https://images.pexels.com/photos/36406458/pexels-photo-36406458.jpeg">
        <img src="https://images.pexels.com/photos/28638351/pexels-photo-28638351.jpeg">
        <img src="https://images.pexels.com/photos/30060251/pexels-photo-30060251.jpeg">
        <img src="https://images.pexels.com/photos/8473699/pexels-photo-8473699.jpeg">
        <img src="https://images.pexels.com/photos/18026534/pexels-photo-18026534.jpeg">

    </div>

</div>

</body>
</html>
